AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: vaultomic backend

######################################
# Parameters #
######################################
Parameters:
  ApiVersion:
    Type: String
    Default: v1
    Description: Enter API version

  StageName:
    Type: String
    Default: dev
    Description: Enter dev, staging, or prod

  NodeJsRuntime:
    Type: String
    Default: nodejs18.x
    Description: Enter like nodejs14.x

######################################
# Global configurations #
######################################
Globals:
  Function:
    Runtime: !Sub ${NodeJsRuntime}
    MemorySize: 128 # MB
    Timeout: 30 # Seconds
    Layers:
      - !Ref NodeModulesLayer
      - !Ref CustomLibrariesLayer
    Environment:
      Variables:
        # General
        STAGE: !Sub ${StageName}
        REGION: !Sub ${AWS::Region}
        TABLE_NAME: !Sub vaultomic_${StageName}
        S3_STORAGE_BUCKET: !Sub vaultomic-storage-${StageName}
        SECRET_STORAGE_BUCKET: secrets.primefaya.com
        PUBLIC_STORAGE_BUCKET: public.primefaya.com

######################################
# Conditions #
######################################
Conditions: 
  IsProductionEnvironment: !Equals [ !Ref StageName, prod ]

######################################
# Resources #
######################################
Resources:
  ######################################
  # Lambda Functions - Layers
  ######################################
  ### NPM Libraries Layer ###
  NodeModulesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub node-modules-layer-vaultomic-${StageName}-${ApiVersion}
      Description: A layer with npm packages
      ContentUri: ./lambda/layers/npm
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: !Sub ${NodeJsRuntime}

  ### Custom Libraries Layer ###
  CustomLibrariesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub custom-libraries-layer-vaultomic-${StageName}-${ApiVersion}
      Description: A layer with custom libraries
      ContentUri: ./lambda/layers/custom
      RetentionPolicy: Retain
    Metadata:
      BuildMethod: !Sub ${NodeJsRuntime}

  ######################################
  # Cognito
  ######################################
  ### Cognito ###
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub vaultomic-${StageName}
      EmailConfiguration: 
        EmailSendingAccount: DEVELOPER
        From: support@vaultomic.com
        SourceArn: arn:aws:ses:us-east-1:258084617016:identity/vaultomic.com
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: false
          RequireNumbers: true
          RequireSymbols: false
      UsernameAttributes:
        - email
      Schema:
        - AttributeDataType: String
          Name: userName
          Mutable: true
          Required: false
        - AttributeDataType: String
          Name: email
          Mutable: true
          Required: true
      AutoVerifiedAttributes:
        - email
      EmailVerificationSubject: "Verification - vaultomic"
      EmailVerificationMessage: "Here's your verification code: <b>{####}</b> <br>Please provide it inside the application."
      
  UserPoolDomain: 
    DependsOn: CognitoUserPool
    Type: AWS::Cognito::UserPoolDomain 
    Properties:
      UserPoolId: !Ref CognitoUserPool 
      Domain: !Sub vaultomic-auth-${StageName}

  CognitoUserPoolClient:
    DependsOn:
      - CognitoUserPool
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref CognitoUserPool
      ClientName: !Sub ${StageName}-vaultomic-pool-client
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
        - implicit
      AllowedOAuthScopes:
        - email
        - openid
        - profile
        - aws.cognito.signin.user.admin
      RefreshTokenValidity: 365
      ReadAttributes:
        - "custom:userName"
        - email
      WriteAttributes:
        - "custom:userName"
        - email
      CallbackURLs:
        - comprimefayavaultomicwebviewcallback://
      LogoutURLs:
        - comprimefayavaultomicwebviewcallback://

  ######################################
  # DynamoDB
  ######################################
  ### DatabaseTable ###
  DatabaseTable:
    Type: AWS::DynamoDB::GlobalTable # Manually enable Point-in-time recovery (PITR)
    Properties: 
      TableName: !Sub vaultomic_${StageName}
      BillingMode: "PAY_PER_REQUEST"
      AttributeDefinitions: 
        -
          AttributeName: "pk"
          AttributeType: "S"
        -
          AttributeName: "sk"
          AttributeType: "S"
        # CognitoIdentifierGSI
        -
          AttributeName: "userCognitoId"
          AttributeType: "S"
        # UserEmailGSI
        -
          AttributeName: "userEmail"
          AttributeType: "S"
        # VaultMembershiplGSI
        -
          AttributeName: "vaultMemberUserEmail"
          AttributeType: "S"
        # itemOwnershipGSI
        -
          AttributeName: "itemOwner"
          AttributeType: "S"
        -
          AttributeName: "itemContext" # For example SERVICE#service_id
          AttributeType: "S"
        # itemAncestryGSI
        -
          AttributeName: "itemAncestor"
          AttributeType: "S"
      KeySchema:
        -
          AttributeName: "pk"
          KeyType: "HASH"
        -
          AttributeName: "sk"
          KeyType: "RANGE"
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      GlobalSecondaryIndexes:
        # CognitoIdentifierGSI
        - IndexName: CognitoIdentifierGSI
          KeySchema:
            - AttributeName: "userCognitoId"
              KeyType: "HASH"
          Projection:
            ProjectionType: ALL
        # UserEmailGSI
        - IndexName: UserEmailGSI
          KeySchema:
            - AttributeName: "userEmail"
              KeyType: "HASH"
          Projection:
            ProjectionType: KEYS_ONLY
        # VaultMembershiplGSI
        - IndexName: VaultMembershiplGSI
          KeySchema:
            - AttributeName: "vaultMemberUserEmail"
              KeyType: "HASH"
            - AttributeName: "pk"
              KeyType: "RANGE"
          Projection:
            ProjectionType: ALL
        # itemOwnershipGSI - Query self data
        - IndexName: itemOwnershipGSI
          KeySchema:
            - AttributeName: "itemOwner"
              KeyType: "HASH"
            - AttributeName: "itemContext"
              KeyType: "RANGE"
          Projection:
            ProjectionType: ALL
        # itemAncestryGSI - Query self data + descendart data
        - IndexName: itemAncestryGSI
          KeySchema:
            - AttributeName: "itemAncestor"
              KeyType: "HASH"
            - AttributeName: "itemContext"
              KeyType: "RANGE"
          Projection:
            ProjectionType: KEYS_ONLY
      Replicas:
        - Region: !Sub ${AWS::Region}

  ######################################
  # S3
  ######################################
  ### Storage Bucket ###
  StorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub vaultomic-storage-${StageName}
      AccessControl: Private
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
            AllowedOrigins:
              - '*'
            Id: corsRule1

  ######################################
  # Lambda - Cognito Triggers
  ######################################
  ### OnUserRegister ###
  OnUserRegister:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub OnUserRegister-vaultomic-${StageName}-${ApiVersion}
      CodeUri: ./lambda/triggers/cognito/on-user-register
      Handler: app.lambdaHandler
      Policies:
        - AmazonDynamoDBFullAccess
      Events:
        ExplicitApi:
          Type: Cognito
          Properties:
            UserPool: !Ref CognitoUserPool
            Trigger: PostConfirmation





  

















 
 




  



 
















  

 

 
  






 

  